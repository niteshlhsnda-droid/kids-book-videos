<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }} — The Big Bedtime Storybook</title>
<meta name="description" content="Cozy illustrated bedtime stories for ages 4–7.">
{% include head-custom.html %}
<link rel="stylesheet" href="{{ '/assets/css/storybook.css' | relative_url }}">
</head>
<body class="storybook">
{{ content }}
<footer class="site-foot">
  <div class="hearts">🌙 📚 ✨</div>
  <p>The Big Bedtime Storybook — cozy tales for ages 4–7.<br>New stories added daily.</p>
  <p class="start-here-link">👋 <a href="/kids-book-videos/start-here/">New here? Start here</a></p>
</footer>
<div id="cc-banner" hidden>
  <p>🍪 We use optional analytics cookies (PostHog) to understand visits and improve storytime. No ads, no cross-site tracking.</p>
  <div class="cc-buttons">
    <button id="cc-accept" type="button">Accept</button>
    <button id="cc-decline" type="button">Decline</button>
  </div>
</div>
<script>
(function(){
  var KEY="cc-consent",b=document.getElementById("cc-banner");
  function hide(){b.hidden=true;}
  var cur=null;try{cur=localStorage.getItem(KEY);}catch(e){}
  if(!cur&&b){b.hidden=false;}
  document.getElementById("cc-accept").addEventListener("click",function(){try{localStorage.setItem(KEY,"accepted");}catch(e){}hide();if(window.__loadPostHog)window.__loadPostHog();});
  document.getElementById("cc-decline").addEventListener("click",function(){try{localStorage.setItem(KEY,"declined");}catch(e){}hide();});
})();
</script>
</body>
</html>
